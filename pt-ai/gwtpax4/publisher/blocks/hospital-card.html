<!-- 병원 카드 (hospital_detail). 칸: head info staff table rest foot -->
<div class="pb-card pb-card--hospital">
  <div class="pb-card__head">
    <span class="pb-badge">병원 정보</span>
    <div class="pb-card__title" data-ab-slot="head"></div>
  </div>
  <div class="pb-card__info" data-ab-slot="info"></div>
  <div class="pb-card__summary" data-ab-slot="staff"></div>
  <div class="pb-card__table" data-ab-slot="table"></div>
  <div class="pb-card__more" data-ab-if="rest"><div data-ab-slot="rest"></div></div>
  <div class="pb-card__foot" data-ab-slot="foot"></div>
</div>
