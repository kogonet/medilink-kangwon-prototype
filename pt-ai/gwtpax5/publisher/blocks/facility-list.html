<!-- 기관 목록 (search_facilities). 칸: intro head hint note table more outro foot -->
<div class="pb-card">
  <div data-ab-slot="intro"></div>
  <div class="pb-card__head">
    <span class="pb-badge">기관 목록</span>
    <div class="pb-card__summary" data-ab-slot="head"></div>
  </div>
  <div class="pb-card__hint" data-ab-if="hint"><div data-ab-slot="hint"></div></div>
  <div class="pb-card__note" data-ab-if="note"><div data-ab-slot="note"></div></div>
  <div class="pb-card__table" data-ab-slot="table"></div>
  <div class="pb-card__more" data-ab-if="more"><div data-ab-slot="more"></div></div>
  <div data-ab-slot="outro"></div>
  <div class="pb-card__foot" data-ab-slot="foot"></div>
</div>
