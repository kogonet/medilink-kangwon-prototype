<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이디·비밀번호 찾기 - 메디링크 강원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/common/front/kor/css/landing.css">

<!-- 리뉴얼 레이어: 원안 CSS 다음 -->
<link rel="stylesheet" href="common/front/kor/css/rn.css">
<link rel="stylesheet" href="common/front/kor/css/rn-sub.css">
</head>
<body class="op_sub op_acc">

<main id="main" tabindex="-1">
<section class="ac_page" aria-labelledby="acT"><h1 id="acT">아이디·비밀번호 찾기</h1><div class="ac_tabs" role="tablist" aria-label="찾기 종류"><button type="button" role="tab" id="tId" aria-selected="true" aria-controls="pId">아이디 찾기</button><button type="button" role="tab" id="tPw" aria-selected="false" aria-controls="pPw">비밀번호 찾기</button></div>
<form class="ac_form" id="pId" role="tabpanel" aria-labelledby="tId" data-ac="find" novalidate><div class="ac_f"><label for="fn">이름</label><input id="fn" name="fn" type="text" placeholder="이름" autocomplete="name" required></div><div class="ac_f"><label for="fp">휴대폰 번호</label><input id="fp" name="fp" type="tel" placeholder="010-0000-0000" autocomplete="tel" required></div>
  <button class="ac_btn" type="submit">인증번호 받기</button><p class="ac_err" role="alert" hidden></p></form>
<form class="ac_form" id="pPw" role="tabpanel" aria-labelledby="tPw" data-ac="find" hidden novalidate><div class="ac_f"><label for="fi">아이디</label><input id="fi" name="fi" type="text" placeholder="아이디" autocomplete="username" required></div><div class="ac_f"><label for="fe">이메일</label><input id="fe" name="fe" type="email" placeholder="name@example.com" autocomplete="email" required></div>
  <button class="ac_btn" type="submit">임시 비밀번호 발송</button><p class="ac_err" role="alert" hidden></p></form>
<nav class="ac_links" aria-label="계정 도움말"><a href="login.html">로그인</a><a href="join.html">회원가입</a></nav></section>
<p class="op_sr" id="acMsg" role="status" aria-live="polite"></p>
</main>
<!-- 리뉴얼 레이어: 원안 스크립트 다음 -->
<script src="common/front/kor/js/rn.js" defer></script>
<script src="common/front/kor/js/rn-sub.js" defer></script>
</body></html>
