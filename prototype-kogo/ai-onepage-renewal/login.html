<head>

<body class="op_sub op_acc">

<main id="main" tabindex="-1">
<section class="ac_page" aria-labelledby="acT"><h1 id="acT">로그인</h1><p class="ac_lead">로그인은 선택입니다. 로그인하지 않아도 모든 기능을 이용할 수 있고, 로그인하면 대화 기록과 즐겨찾는 기관을 저장할 수 있어요.</p>
<form class="ac_form" data-ac="login" novalidate><div class="ac_f"><label for="id">아이디</label><input id="id" name="id" type="text" placeholder="아이디" autocomplete="username" required></div><div class="ac_f"><label for="pw">비밀번호</label><input id="pw" name="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required></div>
  <label class="ac_chk"><input type="checkbox" id="keep"> 로그인 상태 유지</label>
  <button class="ac_btn" type="submit">로그인</button>
  <p class="ac_err" id="acErr" role="alert" hidden></p>
</form>
<nav class="ac_links" aria-label="계정 도움말"><a href="find-account.html">아이디 찾기</a><a href="find-account.html#pw">비밀번호 찾기</a><a href="join.html">회원가입</a></nav>
<a class="ac_skip" href="index.html">로그인 없이 계속 이용하기</a></section>
<p class="op_sr" id="acMsg" role="status" aria-live="polite"></p>
</main>
