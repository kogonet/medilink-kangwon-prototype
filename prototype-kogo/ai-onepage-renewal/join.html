<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - 메디링크 강원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/common/front/kor/css/landing.css">

<!-- 리뉴얼 레이어: 원안 CSS 다음 -->
<link rel="stylesheet" href="common/front/kor/css/rn.css">
<link rel="stylesheet" href="common/front/kor/css/rn-sub.css">
</head>
<body class="op_sub op_acc">

<main id="main" tabindex="-1">
<section class="ac_page" aria-labelledby="acT"><h1 id="acT">회원가입</h1><p class="ac_lead">가입하면 대화 기록 저장과 즐겨찾는 기관 관리를 이용할 수 있어요.</p>
<form class="ac_form" data-ac="join" novalidate><div class="ac_f"><label for="nm">이름</label><input id="nm" name="nm" type="text" placeholder="이름" autocomplete="name" required></div><div class="ac_f"><label for="id">아이디</label><input id="id" name="id" type="text" placeholder="영문·숫자 6자 이상" autocomplete="username" required></div><div class="ac_f"><label for="pw">비밀번호</label><input id="pw" name="pw" type="password" placeholder="8자 이상" autocomplete="new-password" required></div><div class="ac_f"><label for="pw2">비밀번호 확인</label><input id="pw2" name="pw2" type="password" placeholder="비밀번호를 한 번 더" autocomplete="new-password" required></div><div class="ac_f"><label for="ph">휴대폰 번호</label><input id="ph" name="ph" type="tel" placeholder="010-0000-0000" autocomplete="tel" required></div>
  <fieldset class="ac_terms"><legend>약관 동의</legend>
    <label class="ac_chk"><input type="checkbox" id="tAll"> 전체 동의</label>
    <label class="ac_chk"><input type="checkbox" class="t" required> (필수) 이용약관 <a href="../intro-renewal/terms.html">보기</a></label>
    <label class="ac_chk"><input type="checkbox" class="t" required> (필수) 개인정보 수집·이용</label>
    <label class="ac_chk"><input type="checkbox" class="t"> (선택) 소식·안내 수신</label>
  </fieldset>
  <button class="ac_btn" type="submit">가입하기</button>
  <p class="ac_err" id="acErr" role="alert" hidden></p>
</form>
<nav class="ac_links" aria-label="계정 도움말"><a href="login.html">이미 계정이 있어요 · 로그인</a></nav></section>
<p class="op_sr" id="acMsg" role="status" aria-live="polite"></p>
</main>
<!-- 리뉴얼 레이어: 원안 스크립트 다음 -->
<script src="common/front/kor/js/rn.js" defer></script>
<script src="common/front/kor/js/rn-sub.js" defer></script>
</body></html>
