<section class="section"><div class="map" role="img" aria-label="지도 영역"></div>
<div class="where"><h2>오시는 곳</h2>
<dl class="kv"><div><dt>주소</dt><dd id="addr">강원특별자치도 원주시 지정면 기업도시로 200, 213-4호(의료기기종합지원센터)</dd></div><div><dt>건물</dt><dd>의료기기종합지원센터</dd></div><div><dt>호실</dt><dd>213-4호</dd></div><div><dt>우편</dt><dd>26354</dd></div></dl>
<div class="actions">
<a class="button is-primary" href="https://www.google.com/maps/search/?api=1&amp;query=%EA%B0%95%EC%9B%90%ED%8A%B9%EB%B3%84%EC%9E%90%EC%B9%98%EB%8F%84%20%EC%9B%90%EC%A3%BC%EC%8B%9C%20%EC%A7%80%EC%A0%95%EB%A9%B4%20%EA%B8%B0%EC%97%85%EB%8F%84%EC%8B%9C%EB%A1%9C%20200%2C%20213-4%ED%98%B8%28%EC%9D%98%EB%A3%8C%EA%B8%B0%EA%B8%B0%EC%A2%85%ED%95%A9%EC%A7%80%EC%9B%90%EC%84%BC%ED%84%B0%29" target="_blank" rel="noopener">구글맵에서 보기 <span aria-hidden="true">↗</span></a>

<button class="button" type="button" id="copy">주소 복사</button>

<!-- 헤더·퀵메뉴·푸터·프롬프트 독·병원 AI 세션은 rn.js 가 주입 -->
<script>
document.getElementById('copy').addEventListener('click', function () {
  var btn = this, text = document.getElementById('addr').textContent;
  function done() { btn.textContent = '복사되었습니다'; setTimeout(function () { btn.textContent = '주소 복사'; }, 1600); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { select(); });
  } else { select(); }
  function select() {
    var r = document.createRange(); r.selectNodeContents(document.getElementById('addr'));
    var s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
});
</script>
